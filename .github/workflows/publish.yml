name: Publish PHP image

on:
  workflow_dispatch:
    inputs:
      PHPVersion:
        description: PHP major/minor version
        required: true
        default: '7.4'
        type: string
      NewRelicPHPAgent:
        description: New Relic PHP agent version
        required: true
        default: '10.7.0.319'
        type: string
      NewRelicPHPAgentSHA256:
        description: SHA-256 of the New Relic musl archive
        required: true
        default: '64d81d741d0e278d27a5ce96bbc6c8849f7f3fc42a49c81e3795af076e93a7ef'
        type: string
      version:
        description: Immutable release tag (for example, 7.4.33-cve-2026-109618-109619-r1)
        required: true
        type: string

concurrency:
  group: publish-php-${{ inputs.PHPVersion }}
  cancel-in-progress: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/php-${{ inputs.PHPVersion }}-newrelic-${{ inputs.NewRelicPHPAgent }}
      CANDIDATE_TAG: ghcr.io/${{ github.repository }}/php-${{ inputs.PHPVersion }}-newrelic-${{ inputs.NewRelicPHPAgent }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate inputs
        env:
          PHP_VERSION: ${{ inputs.PHPVersion }}
          NEWRELIC_VERSION: ${{ inputs.NewRelicPHPAgent }}
          NEWRELIC_SHA256: ${{ inputs.NewRelicPHPAgentSHA256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          [[ "$PHP_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid PHP version: $PHP_VERSION" >&2
            exit 1
          }
          [[ "$NEWRELIC_VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || {
            echo "Invalid New Relic version: $NEWRELIC_VERSION" >&2
            exit 1
          }
          [[ "$NEWRELIC_SHA256" =~ ^[a-f0-9]{64}$ ]] || {
            echo 'New Relic SHA-256 must contain exactly 64 lowercase hexadecimal characters' >&2
            exit 1
          }
          if [[ "$PHP_VERSION" == '8.1' ]] && ! dpkg --compare-versions "$NEWRELIC_VERSION" ge '12.12.0.41'; then
            echo 'Patched PHP 8.1 requires New Relic PHP agent 12.12.0.41 or newer' >&2
            exit 1
          fi
          [[ "$RELEASE_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]] || {
            echo "Invalid release tag: $RELEASE_VERSION" >&2
            exit 1
          }
          if [[ "$RELEASE_VERSION" == 'latest' ]]; then
            echo 'The latest tag is intentionally not published by this workflow' >&2
            exit 1
          fi

      - name: Resolve PHP build profile
        id: php_profile
        env:
          PHP_VERSION: ${{ inputs.PHPVersion }}
        run: |
          set -euo pipefail

          case "$PHP_VERSION" in
            7.4)
              {
                echo 'base_image=php:7.4.33-fpm-alpine3.16@sha256:0aeb129a60daff2874c5c70fcd9d88cdf3015b4fb4cc7c3f1a32a21e84631036'
                echo 'expected_version=7.4.33'
                echo 'patch_file=php-7.4-cve-2026-109618-109619.patch'
                echo 'patch_ids=CVE-2026-109618,CVE-2026-109619'
                echo 'patch_commit=712e60f9edfd03f0960fc4fc3c2c375f42b90aa2'
                echo 'patch_sha256=4ce7225e512ed559ac92ef9934f00399b1083f5371dc82e1c535bdfa9d74664f'
                echo 'compat_patch_file='
                echo 'compat_patch_sha256='
              } >> "$GITHUB_OUTPUT"
              ;;
            8.1)
              {
                echo 'base_image=php:8.1.34-fpm-alpine3.22@sha256:65802aa6e89b89d3378f04913bd3d397dc572325bd6337a75fb8d4fb5e7fe86b'
                echo 'expected_version=8.1.34'
                echo 'patch_file=php-8.1-cve-2026-109618-109619.patch'
                echo 'patch_ids=CVE-2026-109618,CVE-2026-109619'
                echo 'patch_commit=1d7dec178a094e6e75b229ce22754045f8c6070a'
                echo 'patch_sha256=2c26157e765e982a872d8456520ec215c5f1516dcbc898477b9a8e9017ed0935'
                echo 'compat_patch_file=php-8.1-alpine3.22-rebuild-compat.patch'
                echo 'compat_patch_sha256=a141037dd52ff18cebad0e1c0b96b02ba14919ff57856ced7e253bb4d071272c'
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::PHP $PHP_VERSION has no pinned security profile; using the official floating Alpine tag without a PHP core patch"
              {
                echo "base_image=php:${PHP_VERSION}-fpm-alpine"
                echo 'expected_version='
                echo 'patch_file='
                echo 'patch_ids='
                echo 'patch_commit='
                echo 'patch_sha256='
                echo 'compat_patch_file='
                echo 'compat_patch_sha256='
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: false
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release tag does not already exist
        if: false
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: $IMAGE:$RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Build candidate image
        id: candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: ${{ env.CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          build-args: |
            PHP_BASE_IMAGE=${{ steps.php_profile.outputs.base_image }}
            PHP_VERSION_SERIES=${{ inputs.PHPVersion }}
            PHP_EXPECTED_VERSION=${{ steps.php_profile.outputs.expected_version }}
            PHP_SECURITY_PATCH_FILE=${{ steps.php_profile.outputs.patch_file }}
            PHP_SECURITY_PATCH_IDS=${{ steps.php_profile.outputs.patch_ids }}
            PHP_SECURITY_PATCH_COMMIT=${{ steps.php_profile.outputs.patch_commit }}
            PHP_SECURITY_PATCH_SHA256=${{ steps.php_profile.outputs.patch_sha256 }}
            PHP_REBUILD_COMPAT_PATCH_FILE=${{ steps.php_profile.outputs.compat_patch_file }}
            PHP_REBUILD_COMPAT_PATCH_SHA256=${{ steps.php_profile.outputs.compat_patch_sha256 }}
            NEWRELIC_PHP_AGENT=${{ inputs.NewRelicPHPAgent }}
            NEWRELIC_PHP_AGENT_SHA256=${{ inputs.NewRelicPHPAgentSHA256 }}
          cache-from: type=gha,scope=php-${{ inputs.PHPVersion }}
          cache-to: type=gha,mode=max,scope=php-${{ inputs.PHPVersion }}

      - name: Smoke test candidate image
        env:
          EXPECTED_PHP_SERIES: ${{ inputs.PHPVersion }}
          EXPECTED_PHP_VERSION: ${{ steps.php_profile.outputs.expected_version }}
          EXPECTED_PATCH_COMMIT: ${{ steps.php_profile.outputs.patch_commit }}
          SECURITY_PATCH_FILE: ${{ steps.php_profile.outputs.patch_file }}
        run: |
          set -euo pipefail

          docker image inspect "$CANDIDATE_TAG" >/dev/null
          sh scripts/smoke-test.sh "$CANDIDATE_TAG" linux/amd64

      - name: Publish tested candidate image
        if: false
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE:sha-${GITHUB_SHA}" \
            --tag "$IMAGE:$RELEASE_VERSION" \
            "$IMAGE@$CANDIDATE_DIGEST"
