name: Publish PHP image

on:
  workflow_dispatch:
    inputs:
      PHPVersion:
        description: PHP major/minor version
        required: true
        default: '7.4'
        type: string
      NewRelicPHPAgent:
        description: New Relic PHP agent version
        required: true
        default: '10.7.0.319'
        type: string
      NewRelicPHPAgentSHA256:
        description: SHA-256 of the New Relic musl archive
        required: true
        default: '64d81d741d0e278d27a5ce96bbc6c8849f7f3fc42a49c81e3795af076e93a7ef'
        type: string
      version:
        description: Immutable release tag (for example, 7.4.33-cve-2026-109618-109619-r1)
        required: true
        type: string

concurrency:
  group: publish-php-${{ inputs.PHPVersion }}
  cancel-in-progress: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate inputs
        env:
          PHP_VERSION: ${{ inputs.PHPVersion }}
          NEWRELIC_VERSION: ${{ inputs.NewRelicPHPAgent }}
          NEWRELIC_SHA256: ${{ inputs.NewRelicPHPAgentSHA256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          [[ "$PHP_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid PHP version: $PHP_VERSION" >&2
            exit 1
          }
          [[ "$NEWRELIC_VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || {
            echo "Invalid New Relic version: $NEWRELIC_VERSION" >&2
            exit 1
          }
          [[ "$NEWRELIC_SHA256" =~ ^[a-f0-9]{64}$ ]] || {
            echo 'New Relic SHA-256 must contain exactly 64 lowercase hexadecimal characters' >&2
            exit 1
          }
          [[ "$RELEASE_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]] || {
            echo "Invalid release tag: $RELEASE_VERSION" >&2
            exit 1
          }
          if [[ "$RELEASE_VERSION" == 'latest' ]]; then
            echo 'The latest tag is intentionally not published by this workflow' >&2
            exit 1
          fi

      - name: Resolve PHP build profile
        id: php_profile
        env:
          PHP_VERSION: ${{ inputs.PHPVersion }}
        run: |
          set -euo pipefail

          case "$PHP_VERSION" in
            7.4)
              {
                echo 'base_image=php:7.4.33-fpm-alpine3.16@sha256:0aeb129a60daff2874c5c70fcd9d88cdf3015b4fb4cc7c3f1a32a21e84631036'
                echo 'expected_version=7.4.33'
                echo 'patch_file=php-7.4-cve-2026-109618-109619.patch'
                echo 'patch_ids=CVE-2026-109618,CVE-2026-109619'
                echo 'patch_commit=712e60f9edfd03f0960fc4fc3c2c375f42b90aa2'
                echo 'patch_sha256=4ce7225e512ed559ac92ef9934f00399b1083f5371dc82e1c535bdfa9d74664f'
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::PHP $PHP_VERSION has no pinned security profile; using the official floating Alpine tag without a PHP core patch"
              {
                echo "base_image=php:${PHP_VERSION}-fpm-alpine"
                echo 'expected_version='
                echo 'patch_file='
                echo 'patch_ids='
                echo 'patch_commit='
                echo 'patch_sha256='
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release tag does not already exist
        env:
          IMAGE: ghcr.io/${{ github.repository }}/php-${{ inputs.PHPVersion }}-newrelic-${{ inputs.NewRelicPHPAgent }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: $IMAGE:$RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Build and push PHP image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/php-${{ inputs.PHPVersion }}-newrelic-${{ inputs.NewRelicPHPAgent }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}/php-${{ inputs.PHPVersion }}-newrelic-${{ inputs.NewRelicPHPAgent }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          build-args: |
            PHP_BASE_IMAGE=${{ steps.php_profile.outputs.base_image }}
            PHP_VERSION_SERIES=${{ inputs.PHPVersion }}
            PHP_EXPECTED_VERSION=${{ steps.php_profile.outputs.expected_version }}
            PHP_SECURITY_PATCH_FILE=${{ steps.php_profile.outputs.patch_file }}
            PHP_SECURITY_PATCH_IDS=${{ steps.php_profile.outputs.patch_ids }}
            PHP_SECURITY_PATCH_COMMIT=${{ steps.php_profile.outputs.patch_commit }}
            PHP_SECURITY_PATCH_SHA256=${{ steps.php_profile.outputs.patch_sha256 }}
            NEWRELIC_PHP_AGENT=${{ inputs.NewRelicPHPAgent }}
            NEWRELIC_PHP_AGENT_SHA256=${{ inputs.NewRelicPHPAgentSHA256 }}
          cache-from: type=gha,scope=php-${{ inputs.PHPVersion }}
          cache-to: type=gha,mode=max,scope=php-${{ inputs.PHPVersion }}
